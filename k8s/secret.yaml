# k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking-app
  labels:
    app: banking-api
type: Opaque
stringData:
  # Using stringData (plain text, auto-encoded)
  API_KEY: "my-secret-api-key-12345"
  JWT_SECRET: "jwt-secret-key-for-signing"
  DB_PASSWORD: "super-secret-password"