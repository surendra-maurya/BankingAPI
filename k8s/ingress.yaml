# Ingress - External access with routing rules
# Requires an Ingress Controller (nginx-ingress, traefik, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking-app
  labels:
    app: banking-api
  annotations:
    # Nginx ingress annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-rps: "5"
spec:
  ingressClassName: nginx
  rules:
    # Rule for banking API
    - host: banking-api.local  # Add to /etc/hosts: 127.0.0.1 banking-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: banking-api-service
                port:
                  number: 80