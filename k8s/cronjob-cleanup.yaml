apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-job
  namespace: banking-app
  labels:
    app: banking-api
    type: cronjob
spec:
  # Schedule: Every day at midnight
  schedule: "0 0 * * *"
  
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  suspend: false
  
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      
      template:
        metadata:
          labels:
            app: cleanup-job
        spec:
          containers:
            - name: cleanup
              image: busybox:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  echo "=========================================="
                  echo "Daily Cleanup Job - $(date)"
                  echo "=========================================="
                  
                  echo ""
                  echo "Starting cleanup tasks..."
                  echo ""
                  
                  # Simulate cleanup tasks
                  echo "1. Cleaning old log files..."
                  sleep 2
                  echo "   Log files cleaned"
                  
                  echo ""
                  echo "2. Removing temporary files..."
                  sleep 2
                  echo "   Temporary files removed"
                  
                  echo ""
                  echo "3. Archiving old transactions..."
                  sleep 2
                  echo "   Old transactions archived"
                  
                  echo ""
                  echo "4. Optimizing storage..."
                  sleep 1
                  echo "   Storage optimized"
                  
                  echo ""
                  echo "=========================================="
                  echo "Cleanup completed at $(date)"
                  echo "=========================================="
              
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
          
          restartPolicy: OnFailure